<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Douro Fleet — Dashboard Operacional</title>
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<style>
  :root {
    --bg: #0d1117;
    --panel: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #1f6feb;
    --green: #3fb950;
    --amber: #d29922;
    --red: #f85149;
    --card: #21262d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace; font-size: 13px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ── Header ── */
  header { display: flex; align-items: center; justify-content: space-between; padding: 0 16px; height: 44px; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .logo { font-size: 14px; font-weight: 700; letter-spacing: .05em; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .logo span { color: var(--accent); }
  .header-right { display: flex; align-items: center; gap: 16px; }
  #clock { color: var(--muted); font-size: 12px; }
  #ws-badge { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: var(--card); border: 1px solid var(--border); color: var(--muted); transition: all .3s; }
  #ws-badge.ok { border-color: var(--green); color: var(--green); }
  #ws-badge.err { border-color: var(--red); color: var(--red); }

  /* ── Layout ── */
  .main { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 280px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; }
  .map-wrap { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }
  .mapboxgl-ctrl-logo { display: none !important; }
  .mapboxgl-ctrl-attrib { font-size: 9px !important; }

  /* ── Sidebar sections ── */
  .s-title { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; padding: 12px 16px 6px; border-bottom: 1px solid var(--border); }

  /* ── Ship cards ── */
  .ship-list { padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .ship-card { padding: 10px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); cursor: pointer; transition: border-color .2s, background .2s; }
  .ship-card:hover { border-color: var(--accent); }
  .ship-card.active { border-color: var(--accent); background: #1c2d3d; }
  .ship-card.live { border-left: 3px solid var(--green); }
  .ship-card .sc-name { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
  .ship-card .sc-mmsi { font-size: 10px; color: var(--muted); margin-bottom: 6px; }
  .sc-row { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); }
  .sc-val { color: var(--text); font-weight: 600; }
  .sc-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--border); margin-right: 5px; transition: background .3s; }
  .sc-dot.live { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .sc-dot.stale { background: var(--amber); }

  /* ── Detail panel ── */
  .detail-panel { padding: 12px 16px; border-top: 1px solid var(--border); flex: 1; }
  .dp-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .dp-name { font-size: 15px; font-weight: 700; }
  .dp-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .dp-cell { background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 8px 10px; }
  .dp-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; margin-bottom: 3px; }
  .dp-value { font-size: 14px; font-weight: 600; }
  .dp-links { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .dp-link { font-size: 11px; color: var(--accent); text-decoration: none; padding: 3px 8px; border: 1px solid var(--accent); border-radius: 4px; opacity: .8; }
  .dp-link:hover { opacity: 1; background: rgba(31,111,235,.15); }
  .dp-empty { color: var(--muted); font-size: 12px; padding: 8px 0; }

  /* ── Barragens ── */
  .barr-section { border-top: 1px solid var(--border); padding: 8px; flex-shrink: 0; }
  .barr-title { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; padding: 4px 0 8px; display: flex; justify-content: space-between; }
  .barr-card { background: var(--card); border: 1px solid var(--border); border-radius: 5px; padding: 7px 10px; margin-bottom: 5px; }
  .barr-name { font-size: 11px; font-weight: 700; margin-bottom: 4px; display: flex; justify-content: space-between; }
  .barr-pct { font-size: 10px; font-weight: 700; }
  .barr-row { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-bottom: 2px; }
  .barr-row span { color: var(--text); font-weight: 600; }
  .barr-bar { background: var(--border); border-radius: 2px; height: 4px; margin-top: 5px; }
  .barr-fill { height: 4px; border-radius: 2px; transition: width .5s; }

  /* ── Log ── */
  .log-area { border-top: 1px solid var(--border); }
  .log-title { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; padding: 8px 16px 4px; display: flex; justify-content: space-between; align-items: center; }
  #log { height: 110px; overflow-y: auto; padding: 4px 16px 8px; display: flex; flex-direction: column-reverse; }
  .log-line { font-size: 10px; color: var(--muted); line-height: 1.6; }
  .log-line.ok { color: var(--green); }
  .log-line.err { color: var(--red); }
  .log-line.info { color: var(--accent); }

  /* ── Map overlays ── */
  .map-hud { position: absolute; bottom: 12px; right: 12px; z-index: 500; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; pointer-events: none; }
  .hud-pill { background: rgba(13,17,23,.85); border: 1px solid var(--border); border-radius: 12px; padding: 4px 10px; font-size: 11px; color: var(--muted); }
  #hud-ships { color: var(--text); }
  #hud-time { color: var(--muted); }

  /* ── Leaflet popup ── */
  .leaflet-popup-content-wrapper { background: var(--panel); border: 1px solid var(--border); color: var(--text); border-radius: 6px; box-shadow: none; }
  .leaflet-popup-tip { background: var(--panel); }
  .popup-title { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
  .popup-row { font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; gap: 16px; }
  .popup-row span { color: var(--text); }
</style>
</head>
<body>

<header>
  <div class="logo">⚓ Douro <span>Fleet</span></div>
  <div class="header-right">
    <div id="clock">--:--:--</div>
    <div id="ws-badge">● A ligar…</div>
  </div>
</header>

<div class="main">
  <div class="sidebar">
    <div class="s-title">Frota — 3 embarcações</div>
    <div class="ship-list" id="ship-list"></div>

    <div class="detail-panel" id="detail-panel">
      <div class="dp-empty">← seleciona um navio</div>
    </div>

    <div class="barr-section">
      <div class="barr-title">🏗️ Barragens do Douro <span id="barr-ts">—</span></div>
      <div id="barr-list">
        <div style="color:var(--muted);font-size:11px">A carregar...</div>
      </div>
    </div>

    <div class="log-area">
      <div class="log-title">
        Feed AIS
        <span id="msg-count" style="color:var(--text)">0 msg</span>
      </div>
      <div id="log"></div>
    </div>
  </div>

  <div class="map-wrap">
    <div id="map"></div>
    <div class="map-hud">
      <div class="hud-pill">Navios ao vivo: <span id="hud-ships">0</span></div>
      <div class="hud-pill" id="hud-time">Última posição: —</div>
    </div>
  </div>
</div>

<script>
// ── Config ────────────────────────────────────────────────────────────────
const API_KEY = 'd4c6145052acffa4c237f35c2d23269f1aa6f9d3';
const VESSELS = [
  { mmsi: '255804680', name: 'Douro Cruiser',  flag: '🇵🇹' },
  { mmsi: '263442283', name: 'Douro Estrela',  flag: '🇵🇹' },
  { mmsi: '263441852', name: 'Avalon Alegria', flag: '🇵🇹' },
];
const MMSI_SET = new Set(VESSELS.map(v => v.mmsi));

// ── State ─────────────────────────────────────────────────────────────────
const state = {};   // mmsi → {name, flag, lat, lon, sog, cog, dest, eta, draught, ts}
let selectedMMSI = null;
let msgCount = 0;
let ws = null;
let wsRetry = 0;

// ── Clock ──────────────────────────────────────────────────────────────────
const clockEl = document.getElementById('clock');
setInterval(() => {
  clockEl.textContent = new Date().toLocaleTimeString('pt-PT', {timeZone:'Europe/Lisbon'});
}, 1000);

// ── Map (Mapbox GL JS) ────────────────────────────────────────────────────
mapboxgl.accessToken = 'pk.eyJ1IjoicmljYXJkb2F2bGlzIiwiYSI6ImNtcWZhaHMzdjE4ZzMycXI4djN0eWd1N2wifQ.fnFTDDKAR8s6DU-g1ei3Ng';

const map = new mapboxgl.Map({
  container: 'map',
  style: 'mapbox://styles/mapbox/streets-v12',
  center: [-8.67, 41.14],
  zoom: 11,
  attributionControl: false
});
map.addControl(new mapboxgl.NavigationControl(), 'top-left');
map.addControl(new mapboxgl.AttributionControl({ compact: true }), 'bottom-right');

const markers = {};

function shipEl(mmsi, active) {
  const d = state[mmsi] || {};
  const cog = d.cog != null ? d.cog : 0;
  const c = active ? '#3fb950' : '#8b949e';
  const stroke = active ? '#0d6e2a' : '#30363d';
  const el = document.createElement('div');
  el.innerHTML = `<svg width="24" height="36" viewBox="0 0 24 36"
    xmlns="http://www.w3.org/2000/svg"
    style="transform:rotate(${cog}deg);transform-origin:12px 18px;display:block">
    <path d="M12,0 L24,8 L24,36 L0,36 L0,8 Z"
      fill="${c}" stroke="${stroke}" stroke-width="1.5" opacity="0.95"/>
    <line x1="12" y1="8" x2="12" y2="28" stroke="${stroke}" stroke-width="1" opacity="0.6"/>
    <line x1="4" y1="20" x2="20" y2="20" stroke="${stroke}" stroke-width="1" opacity="0.6"/>
  </svg>`;
  el.style.cursor = 'pointer';
  return el;
}

function buildPopup(d) {
  const dest = d.dest || '—';
  const eta = d.jul_eta || d.eta || '—';
  const status = d.jul_status ? `<div class="popup-row">Estado <span>${d.jul_status}</span></div>` : '';
  return `<div class="popup-title">${d.flag} ${d.name}</div>
    <div class="popup-row">SOG <span>${fmt(d.sog, 1)} kn</span></div>
    <div class="popup-row">COG <span>${fmt(d.cog, 0)}°</span></div>
    <div class="popup-row">Próximo porto <span style="color:#3fb950;font-weight:700">${dest}</span></div>
    <div class="popup-row">ETA <span style="color:#d29922">${eta}</span></div>
    ${status}`;
}

let followMode = false;

function updateMarker(d) {
  if (!d.lat || !d.lon) return;
  const lngLat = [d.lon, d.lat];
  const active = d.mmsi === selectedMMSI;

  if (markers[d.mmsi]) {
    markers[d.mmsi].setLngLat(lngLat);
    // Atualizar ícone (cor e rotação)
    const el = markers[d.mmsi].getElement();
    const c = active ? '#3fb950' : '#8b949e';
    const stroke = active ? '#0d6e2a' : '#30363d';
    const cog = d.cog != null ? d.cog : 0;
    el.querySelector('svg').style.transform = `rotate(${cog}deg)`;
    el.querySelector('path').setAttribute('fill', c);
    el.querySelector('path').setAttribute('stroke', stroke);
  } else {
    const el = shipEl(d.mmsi, active);
    el.addEventListener('click', () => selectShip(d.mmsi));
    const popup = new mapboxgl.Popup({ offset: 20, maxWidth: '220px' })
      .setHTML(buildPopup(d));
    const m = new mapboxgl.Marker({ element: el, anchor: 'center' })
      .setLngLat(lngLat)
      .setPopup(popup)
      .addTo(map);
    markers[d.mmsi] = m;
  }

  // Follow mode — centra o mapa no navio selecionado
  if (d.mmsi === selectedMMSI && followMode) {
    map.easeTo({ center: lngLat, duration: 500 });
  }
}

// ── Ship cards ─────────────────────────────────────────────────────────────
function renderCards() {
  const list = document.getElementById('ship-list');
  list.innerHTML = '';
  VESSELS.forEach(v => {
    const d = state[v.mmsi] || {};
    const live = d.ts && (Date.now() - d.ts) < 5 * 60 * 1000;
    const card = document.createElement('div');
    card.className = 'ship-card' + (live ? ' live' : '') + (selectedMMSI === v.mmsi ? ' active' : '');
    card.innerHTML = `
      <div class="sc-name"><span class="sc-dot ${live ? 'live' : (d.ts ? 'stale' : '')}"></span>${v.flag} ${v.name}</div>
      <div class="sc-mmsi">MMSI ${v.mmsi}</div>
      <div class="sc-row"><span>SOG</span><span class="sc-val">${d.sog != null ? fmt(d.sog,1)+' kn' : '—'}</span></div>
      <div class="sc-row"><span>Posição</span><span class="sc-val">${d.lat != null ? fmt(d.lat,4)+'N '+fmt(d.lon,4)+'E' : '—'}</span></div>
    `;
    card.onclick = () => selectShip(v.mmsi);
    list.appendChild(card);
  });
}

function renderDetail(mmsi) {
  const panel = document.getElementById('detail-panel');
  if (!mmsi) { panel.innerHTML = '<div class="dp-empty">← seleciona um navio</div>'; return; }
  const v = VESSELS.find(x => x.mmsi === mmsi) || {};
  const d = state[mmsi] || {};
  const vfLink = `https://www.vesselfinder.com/vessels/details/${mmsi}`;
  const mtLink = `https://www.marinetraffic.com/en/ais/details/ships/mmsi:${mmsi}`;
  panel.innerHTML = `
    <div class="dp-header"><span class="dp-name">${v.flag || ''} ${v.name || mmsi}</span></div>
    <div class="dp-grid">
      <div class="dp-cell"><div class="dp-label">SOG</div><div class="dp-value">${d.sog != null ? fmt(d.sog,1)+' kn' : '—'}</div></div>
      <div class="dp-cell"><div class="dp-label">COG</div><div class="dp-value">${d.cog != null ? fmt(d.cog,0)+'°' : '—'}</div></div>
      <div class="dp-cell"><div class="dp-label">Latitude</div><div class="dp-value">${d.lat != null ? fmt(d.lat,5) : '—'}</div></div>
      <div class="dp-cell"><div class="dp-label">Longitude</div><div class="dp-value">${d.lon != null ? fmt(d.lon,5) : '—'}</div></div>
      <div class="dp-cell" style="grid-column:1/-1;border-color:var(--green)"><div class="dp-label">⚓ Próximo porto</div><div class="dp-value" style="font-size:14px;color:var(--green)">${d.dest || '—'}</div></div>
      <div class="dp-cell" style="grid-column:1/-1;border-color:var(--amber)"><div class="dp-label">🕐 ETA estimada</div><div class="dp-value" style="font-size:13px;color:var(--amber)">${d.jul_eta || d.eta || '—'}</div></div>
      <div class="dp-cell"><div class="dp-label">Calado</div><div class="dp-value">${d.draught != null ? fmt(d.draught,1)+' m' : '—'}</div></div>
      <div class="dp-cell"><div class="dp-label">Última msg</div><div class="dp-value" style="font-size:11px">${d.ts ? relTime(d.ts) : '—'}</div></div>
    </div>
    <div class="dp-links">
      <a class="dp-link" href="${vfLink}" target="_blank">VesselFinder ↗</a>
      <a class="dp-link" href="${mtLink}" target="_blank">MarineTraffic ↗</a>
      <a class="dp-link" href="https://livemap.apdl.pt" target="_blank">APDL ↗</a>
    </div>`;
}

function selectShip(mmsi) {
  selectedMMSI = mmsi;
  followMode = true;
  const d = state[mmsi];
  if (d && d.lat && d.lon) {
    map.flyTo({ center: [d.lon, d.lat], zoom: 14, duration: 1000 });
    markers[mmsi]?.togglePopup();
  }
  // Atualizar cores dos marcadores
  Object.entries(markers).forEach(([m, mk]) => {
    const el = mk.getElement();
    const active = m === mmsi;
    const c = active ? '#3fb950' : '#8b949e';
    const stroke = active ? '#0d6e2a' : '#30363d';
    if (el.querySelector('path')) {
      el.querySelector('path').setAttribute('fill', c);
      el.querySelector('path').setAttribute('stroke', stroke);
    }
  });
  renderCards();
  renderDetail(mmsi);
}

// Desativar follow se utilizador arrastar manualmente
map.on('dragend', () => { followMode = false; });

// ── HUD ────────────────────────────────────────────────────────────────────
function refreshHUD() {
  const live = VESSELS.filter(v => state[v.mmsi]?.lat).length;
  document.getElementById('hud-ships').textContent = live;
  const latest = Object.values(state).filter(d => d.ts).sort((a,b) => b.ts-a.ts)[0];
  document.getElementById('hud-time').textContent = latest ? 'Última: ' + relTime(latest.ts) : 'Última posição: —';
}

// ── Helpers ────────────────────────────────────────────────────────────────
function fmt(v, dec) {
  if (v == null || isNaN(v)) return '—';
  return Number(v).toFixed(dec);
}
function relTime(ts) {
  const s = Math.round((Date.now() - ts) / 1000);
  if (s < 60) return s + 's atrás';
  if (s < 3600) return Math.floor(s/60) + 'm atrás';
  return Math.floor(s/3600) + 'h atrás';
}
function log(msg, cls='') {
  const el = document.getElementById('log');
  const line = document.createElement('div');
  line.className = 'log-line ' + cls;
  const t = new Date().toLocaleTimeString('pt-PT', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  line.textContent = `[${t}] ${msg}`;
  el.prepend(line);
  while (el.children.length > 80) el.removeChild(el.lastChild);
}

// ── Decode AISStream message ───────────────────────────────────────────────
// AISStream envia Blob com JSON puro (magic bytes 7b 22 = '{"')
// Não há compressão gzip — basta blob.text()
async function decodeMessage(blob) {
  if (blob instanceof Blob) return await blob.text();
  if (typeof blob === 'string') return blob;
  throw new Error('Tipo de mensagem desconhecido: ' + typeof blob);
}

// ── AIS message handler ────────────────────────────────────────────────────
function handleAIS(json) {
  let msg;
  try { msg = JSON.parse(json); } catch(e) { return; }

  const mmsi = String(
    msg?.MetaData?.MMSI ||
    msg?.Message?.PositionReport?.UserID ||
    msg?.Message?.StandardClassBPositionReport?.UserID ||
    msg?.Message?.ShipStaticData?.UserID ||
    ''
  );
  if (!MMSI_SET.has(mmsi)) return;

  const v = VESSELS.find(x => x.mmsi === mmsi);
  if (!state[mmsi]) state[mmsi] = { mmsi, name: v?.name, flag: v?.flag };
  const d = state[mmsi];
  d.ts = Date.now();

  // Position reports (type 1,2,3,18)
  const pos = msg?.Message?.PositionReport || msg?.Message?.StandardClassBPositionReport;
  if (pos) {
    const lat = pos.Latitude;
    const lon = pos.Longitude;
    // AISStream sends 91/181 as "not available"
    if (lat != null && Math.abs(lat) <= 90) d.lat = lat;
    if (lon != null && Math.abs(lon) <= 180) d.lon = lon;
    if (pos.SpeedOverGround != null) d.sog = pos.SpeedOverGround;
    if (pos.CourseOverGround != null) d.cog = pos.CourseOverGround;
    updateMarker(d);
    log(`${v?.name || mmsi} — ${fmt(d.lat,4)}N ${fmt(d.lon,4)}E  ${fmt(d.sog,1)}kn`, 'ok');
    msgCount++;
    document.getElementById('msg-count').textContent = msgCount + ' msg';
    refreshHUD();
    if (selectedMMSI === mmsi) renderDetail(mmsi);
    renderCards();
  }

  // Static/voyage data (type 5,24)
  const stat = msg?.Message?.ShipStaticData;
  if (stat) {
    if (stat.Destination) d.dest = stat.Destination.trim();
    if (stat.Eta) d.eta = formatETA(stat.Eta);
    if (stat.MaximumStaticDraught) d.draught = stat.MaximumStaticDraught;
    log(`${v?.name || mmsi} — destino: ${d.dest || '—'}`, 'info');
    renderCards();
    if (selectedMMSI === mmsi) renderDetail(mmsi);
  }
}

function formatETA(eta) {
  if (!eta) return '—';
  // AISStream ETA: {Month,Day,Hour,Minute}
  if (typeof eta === 'object') {
    const m = String(eta.Month||0).padStart(2,'0');
    const d = String(eta.Day||0).padStart(2,'0');
    const h = String(eta.Hour||0).padStart(2,'0');
    const mn = String(eta.Minute||0).padStart(2,'0');
    return `${d}/${m} ${h}:${mn}`;
  }
  return String(eta);
}

// ── WebSocket ──────────────────────────────────────────────────────────────
const WS_BADGE = document.getElementById('ws-badge');

function connect() {
  log('A ligar ao AISStream…', 'info');
  WS_BADGE.className = '';
  WS_BADGE.textContent = '● A ligar…';

  ws = new WebSocket('wss://stream.aisstream.io/v0/stream');

  ws.onopen = () => {
    wsRetry = 0;
    WS_BADGE.className = 'ok';
    WS_BADGE.textContent = '● Ligado';
    log('WebSocket 101 — a subscrever MMSIs', 'ok');

    ws.send(JSON.stringify({
      APIKey: API_KEY,
      BoundingBoxes: [[[-90, -180], [90, 180]]],
      FilterMessageTypes: ['PositionReport', 'StandardClassBPositionReport', 'ShipStaticData'],
      MMSIs: VESSELS.map(v => parseInt(v.mmsi)),
    }));
  };

  ws.onmessage = async (evt) => {
    // AISStream always sends Blob; handle both compressed and plain
    if (evt.data instanceof Blob) {
      try {
        const text = await decodeMessage(evt.data);
        handleAIS(text);
      } catch(e) {
        log('Erro Blob: ' + e.message, 'err');
      }
    } else if (typeof evt.data === 'string') {
      handleAIS(evt.data);
    }
  };

  ws.onerror = (e) => {
    log('WebSocket erro', 'err');
  };

  ws.onclose = (e) => {
    WS_BADGE.className = 'err';
    WS_BADGE.textContent = '● Desligado';
    log(`WS fechado (${e.code}) — retry em ${Math.min(30, 2**wsRetry)}s`, 'err');
    const delay = Math.min(30000, 1000 * 2 ** wsRetry++);
    setTimeout(connect, delay);
  };
}

// ── Helpers APDL ──────────────────────────────────────────────────────────
function fmtEtaAPDL(dtStr) {
  if (!dtStr) return '—';
  try {
    const d = new Date(dtStr);
    return d.toLocaleDateString('pt-PT', {day:'2-digit',month:'2-digit'}) + ' ' +
           d.toLocaleTimeString('pt-PT', {hour:'2-digit',minute:'2-digit'});
  } catch(e) { return dtStr; }
}

// ── APDL API (fonte principal — cobertura local Rio Douro) ─────────────────
const APDL_URL = 'https://raspy-union-da12.ricardo-silva-43d.workers.dev';
const HIDRO_URL = 'https://small-hall-03b3.ricardo-silva-43d.workers.dev';

async function fetchAPDL() {
  try {
    const r = await fetch(APDL_URL);
    if (!r.ok) { log('APDL: HTTP ' + r.status, 'err'); return; }
    const json = await r.json();
    const ships = json?.data || (Array.isArray(json) ? json : []);
    let updated = 0;
    ships.forEach(s => {
      const mmsi = String(s.mmsi);
      if (!MMSI_SET.has(mmsi)) return;
      const v = VESSELS.find(x => x.mmsi === mmsi);
      if (!state[mmsi]) state[mmsi] = { mmsi, name: v?.name || s.name, flag: v?.flag || '\u{1F1F5}\u{1F1F9}' };
      const d = state[mmsi];
      try {
        const geo = typeof s.geojson === 'string' ? JSON.parse(s.geojson) : s.geojson;
        if (geo?.coordinates) { d.lon = geo.coordinates[0]; d.lat = geo.coordinates[1]; }
      } catch(e) {}
      if (s.sog != null) d.sog = parseFloat(s.sog);
      if (s.cog != null) d.cog = parseFloat(s.cog);
      if (s.destination) d.dest = s.destination.trim();
      if (s.eta_predicted) d.eta = fmtEtaAPDL(s.eta_predicted);
      if (s.jul_eta) d.jul_eta = fmtEtaAPDL(s.jul_eta);
      if (s.jul_status) d.jul_status = s.jul_status;
      if (s.draught) d.draught = parseFloat(s.draught);
      // Dimensões reais do navio (metros)
      if (s.dim_a != null) d.dim_a = s.dim_a;
      if (s.dim_b != null) d.dim_b = s.dim_b;
      if (s.dim_c != null) d.dim_c = s.dim_c;
      if (s.dim_d != null) d.dim_d = s.dim_d;
      d.ts = new Date(s.last_updated).getTime() || Date.now();
      d.source = 'APDL';
      updateMarker(d);
      updated++;
    });
    if (updated > 0) {
      log('APDL — ' + updated + ' navio(s) atualizado(s)', 'ok');
      msgCount += updated;
      document.getElementById('msg-count').textContent = msgCount + ' msg';
      renderCards();
      if (selectedMMSI) renderDetail(selectedMMSI);
      refreshHUD();
    } else {
      log('APDL — sem dados dos nossos navios', 'info');
    }
  } catch(e) {
    log('APDL erro: ' + e.message, 'err');
  }
}

// ── Barragens Infohídrica ─────────────────────────────────────────────────
function pctColor(p) {
  if (p >= 90) return '#3fb950';
  if (p >= 70) return '#d29922';
  return '#f85149';
}

function renderBarragens(data) {
  const list = document.getElementById('barr-list');
  const ts = document.getElementById('barr-ts');
  if (!data || !data.barragens) return;
  ts.textContent = new Date(data.timestamp).toLocaleTimeString('pt-PT', {hour:'2-digit', minute:'2-digit'});
  list.innerHTML = data.barragens.map(b => {
    const pct = b.percentagem || 0;
    const c = pctColor(pct);
    return `<div class="barr-card">
      <div class="barr-name">
        <span>🏗️ ${b.nome}</span>
        <span class="barr-pct" style="color:${c}">${pct}%</span>
      </div>
      <div class="barr-row">Cota <span>${b.cota != null ? b.cota.toFixed(2)+' m' : '—'} / ${b.npa} m</span></div>
      <div class="barr-row">Lançado <span style="color:#f85149;font-weight:700">${b.lancado != null ? b.lancado+' m³/s' : '—'}</span></div>
      <div class="barr-row">Afluente <span style="color:#58a6ff">${b.afluente != null ? b.afluente+' m³/s' : '—'}</span></div>
      <div class="barr-bar"><div class="barr-fill" style="width:${pct}%;background:${c}"></div></div>
    </div>`;
  }).join('');
}

async function fetchHidro() {
  try {
    const r = await fetch(HIDRO_URL);
    if (!r.ok) { log('Hidro: HTTP ' + r.status, 'err'); return; }
    const data = await r.json();
    renderBarragens(data);
    log('Barragens atualizadas', 'info');
  } catch(e) {
    log('Hidro erro: ' + e.message, 'err');
  }
}
